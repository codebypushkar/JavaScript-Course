<!DOCTYPE html>
<html>

  <body>

    <script>
      function removeEgg(foods){
        let result = [];
        

        for(let i = 0; i < foods.length; i++ ){
          if(foods[i] === 'egg'){
            continue;
          }
          result.push(foods[i]);
          

        }
        return result;
      }

      const foods = ['salad', 'fish','egg','meat','egg','paneer', 'dal','egg','chawal','egg','roti'];
      console.log(removeEgg(foods));

    </script>
  </body>
</html>
