<!DOCTYPE html>
<html>
  <head>
    <title>11H</title>
  </head>
  <body>

    <script>
      const nums = [5, 55, 23, 24, 6, 28];

      function addOne(array){
        let result = [];

        for(let i = 0; i< array.length; i++){
          result.push(array[i] + 1);
        }
        return result;
      }
      console.log(nums);
      console.log(addOne(nums));
    </script>
  </body>
</html>
