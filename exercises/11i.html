<!DOCTYPE html>
<html>
  <head>
    <title>11I</title>
  </head>
  <body>

    <script>
      function addNum(array, num){
        const result = [];

        for(let i = 0; i< array.length; i++){
          result.push(array[i] + num);
        }
        return result;
      }

      console.log(addNum([2, 54, 55, 28, 23], 5));
      console.log(addNum([4, 1, 76, 23, 64], 4));
    </script>
  </body>
</html>
