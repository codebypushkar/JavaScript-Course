<!DOCTYPE html>
<html>
  <head>
    <title>7D-7F</title>
  </head>
  <body>
    <script>
      function convertToFahrenheit(celsius) {
        return (celsius * 9/5) + 32;
      }
      function convertToCelsius(farenheit) {
        return (farenheit - 32)* 5/9;
      }

      console.log(convertToFahrenheit(25));
      console.log(convertToCelsius(86));

      
      function convertTemperature(degrees, unit) {
        if (unit === 'C'){
          const result = convertToFahrenheit(degrees) + ' F';
          return `${result}`;
        } else if(unit === 'F'){
          const result = convertToCelsius(degrees) + ' C';
          return `${result}`;
        }

      }
      console.log(convertTemperature(25, 'C'));
      console.log(convertTemperature(104, 'F'));
      console.log(convertTemperature(36, 'C'));

      
    </script>
  </body>
</html>
