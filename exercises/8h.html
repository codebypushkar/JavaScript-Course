<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>

  </head>
  <body>

    <p>
      Calculator
    </p>
    <p>
      <button onclick="
        updateCalculation('1')">1</button>
      
      <button onclick="
        updateCalculation('2')">2</button>
      
      <button onclick="
        updateCalculation('3')">3</button>
      
      <button onclick="
        updateCalculation(' + ')">+</button>
      
    </p>

    <p>
      <button onclick="
       updateCalculation('4')">4</button>

      <button onclick="
        updateCalculation('5')">5</button>

      <button onclick="
        updateCalculation(' 6');">6</button>

      <button onclick="
        updateCalculation(' - ');">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');">7</button>

      <button onclick="
        updateCalculation('8');">8</button>

      <button onclick="
        updateCalculation('9');">9</button>

      <button onclick="
        updateCalculation(' * ');">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');">0</button>

      <button onclick="
        updateCalculation('.');">.</button>

      
      <button onclick="
        updateCalculation(' = ');">=</button>

      <button onclick="
        updateCalculation(' / ');">/</button>
    </p>

    <p>
      <button onclick="
        calculation = ' ';
        console.log(calculation); 
    ">Clear</button>
    </p>

    <p style="margin-top: 50px;">
      <a>Click here</a> to see the final version of the project
    </p>
    
    
    <script>
      let calculation = localStorage.getItem('calculation') || '';

      console.log();


      function updateCalculation(operator) {
        if(operator == ' = ') {
          calculation = eval(calculation);
          console.log(calculation)
        }else {
          calculation += operator;
          console.log(calculation)
        }
        
        localStorage.setItem('calculation',calculation);
      }
    </script>
  </body>
</html>
