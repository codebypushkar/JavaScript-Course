<!DOCTYPE html>
<html>
  <head>
    <title>8i-8k</title>
  </head>
  <body>
    <p>
      Wanna take a Guess ?
    </p>
    <button onclick="
      playGame('Heads');
      ">Heads</button>
    <button onclick="
      playGame('tails');"
      >Tails</button>
    <script>
      
      const score = JSON.parse(localStorage.getItem('score1')) || {
        wins: 0,
        losses: 0
      }
      console.log(score);
      function playGame(guess){
        const randomNumber = Math.random();
        const result = randomNumber < 0.5 ? 'heads' : 'tails';

        console.log(guess === result ? 'You win!' : 'You lose!');
        
        if(guess === result){
          score.wins += 1;
        }
        else{ 
          score.losses += 1;
        }
        console.log(score);  
        localStorage.getItem('score1',JSON.stringify(score));
      }

      
    </script>
     
  </body>
</html>
