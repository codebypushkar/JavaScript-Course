<!DOCTYPE html>
<html>
  <head>
    <title>11OPQ</title>
  </head>

  <body>

    <script>
      const words = ['hello','world','search','good','search'];
      let index = -1;
      for(let i=0; i < words.length; i++){
        
        if(words[i] === 'search'){
          index = i;
          break;
        }
      }
      console.log(index);

      function findIndex(array, word){

        for(let i=0; i < array.length; i++){
          
          if(array[i] === word){
            return i;
          }
        }
        return -1;

      }
      
      findIndex(['green','red', 'blue', 'red'], 'red');
      findIndex(['red', 'blue', 'red'], 'red');

    </script>
  </body>
</html>
