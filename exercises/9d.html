<!DOCTYPE html>
<html>
  <head>
    <title>9C</title>
  </head>
  <body>
    <input placeholder="Name" onkeydown="
      displayNamekeydown(event);" class="inputname">
    <button onclick="displayName()">Submit</button>
    <p class="js-display" onclick="displayName()"></p>
    <script>

      function displayNamekeydown(event){
        if(event.key === 'Enter'){
          displayName()
        }
      }
      function displayName(){
        const inputElement = document.querySelector('.inputname');
        const name = inputElement.value;
        
        let paraElement = document.querySelector('.js-display');
        paraElement.innerHTML = `Your name is: 
        ${name}`;
        
      }      
    </script>
  </body>
</html>
