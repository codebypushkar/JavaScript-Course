<!DOCTYPE html>
<html>
  <head>
    <title>App</title>
  </head>

  <body>
    <button onclick="
      messages++;
      displayNotification();
      ">
      Add
    </button>
    
    <button onclick="
      if(messages >0){
        messages--;
        displayNotification();

      if(messages === 0){
        stopNotification();
      }
      }
      
      ">
      Remove
    </button>

    <script>

      let messages = 2;

      let intervalID;

      let isDisplayingNotification;

      displayNotification();
      
      function displayNotification() {
        if(isDisplayingNotification){
          return;
        }

        isDisplayingNotification = true;


        intervalID = setInterval(function(){
          if(document.title === 'App'){
            document.title = `(${messages}) New messages`;
          }else {
            document.title = 'App';
          }
        },1000);
      }


      function stopNotification(){
        clearInterval(intervalID);
        isDisplayingNotification = false;
        document.title = 'App';

      }
    </script>
  </body>
</html>
